<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The saved theme, before the page paints (site/theme.ts runs the button). -->
    <script>
        try {
          const theme = localStorage.getItem("list-picker-theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch {}
    </script>
    <title>list-picker playground</title>
    <link rel="icon" href="../favicon-32.png" sizes="32x32" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  </head>
  <body>
    <!-- nav ../ in:board.html -->
    <main class="demo">
    <header class="demo-head">
      <h1>Playground</h1>
    </header>
    <div class="skins" role="radiogroup" aria-labelledby="skins-label">
      <span id="skins-label">Same board, your look:</span>
      <input type="radio" name="skin" id="skin-cards" value="cards" checked />
      <label for="skin-cards">Cards</label>
      <input type="radio" name="skin" id="skin-terminal" value="terminal" />
      <label for="skin-terminal">Terminal</label>
      <input type="radio" name="skin" id="skin-pop" value="pop" />
      <label for="skin-pop">Pop</label>
    </div>
    <div class="board" id="board" data-skin="cards"></div>
    <section class="panel" aria-labelledby="edit-title">
      <h2 id="edit-title">Edit the board</h2>
      <form id="add-list">
        <strong>Add list</strong>
        <div class="fields">
          <input name="id" placeholder="list id" autocomplete="off" required />
          <label>before <select name="before"></select></label>
          <button type="submit">Add</button>
        </div>
      </form>
      <form id="add-card">
        <strong>Add card</strong>
        <div class="fields">
          <input name="id" placeholder="card id" autocomplete="off" required />
          <label>to <select name="list"></select></label>
          <label>before <select name="before"></select></label>
          <button type="submit">Add</button>
        </div>
      </form>
      <form id="move-card">
        <strong>Move card</strong>
        <div class="fields">
          <select name="card" aria-label="card"></select>
          <label>to <select name="list"></select></label>
          <label>before <select name="before"></select></label>
          <button type="submit">Move</button>
        </div>
      </form>
      <p class="status" id="status" role="status"></p>
      <p class="error" id="error" role="alert"></p>
    </section>
    <section class="panel" aria-labelledby="events-title">
      <h2 class="log-title"><span id="events-title">Events</span> <small id="changes"></small></h2>
      <ol class="log" id="log" reversed></ol>
    </section>
    </main>
    <script type="module" src="./main.ts"></script>
    <dialog id="opened">
      <form method="dialog">
        <p></p>
        <label>Name <input name="name" autocomplete="off" /></label>
        <button type="submit" value="save">Save</button>
        <button type="submit" value="close">Close</button>
      </form>
    </dialog>
  </body>
</html>

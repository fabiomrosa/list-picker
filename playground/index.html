<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>list-picker playground</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 2rem; color: #1f2933; }
      h1 { font-size: 1.25rem; }
      form { display: flex; gap: 0.5rem; align-items: center; margin: 1rem 0; }
      input, select, button { font: inherit; padding: 0.35rem 0.6rem; }
      .error { color: #b42318; min-height: 1.4em; }
      .list { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem; }
      .node { border: 1px solid #9aa5b1; border-radius: 6px; padding: 0.5rem 0.75rem; min-width: 6rem; }
      .node { position: relative; }
      .node strong { display: block; font-size: 1.1rem; }
      .remove { position: absolute; top: 0.2rem; right: 0.3rem; border: 0; background: none; color: #9aa5b1; cursor: pointer; padding: 0 0.2rem; }
      .remove:hover { color: #b42318; }
      .node small { display: block; color: #616e7c; }
      .link { color: #9aa5b1; }
      .meta { color: #616e7c; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <h1>LinkedList</h1>
    <form id="append">
      <input name="id" placeholder="id" autocomplete="off" required />
      <label>before <select name="before" id="before"></select></label>
      <button type="submit">Insert</button>
    </form>
    <p class="error" id="error"></p>
    <div class="list" id="list"></div>
    <p class="meta" id="meta"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

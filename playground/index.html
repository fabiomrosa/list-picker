<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>list-picker playground</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 2rem; color: #1f2933; background: #f5f7fa; }
      h1 { font-size: 1.25rem; }
      h1 small { font-size: 0.8rem; font-weight: normal; color: #616e7c; }
      form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.5rem 0; }
      form strong { width: 5.5rem; }
      input, select, button { font: inherit; padding: 0.3rem 0.5rem; }
      input { width: 7rem; }
      .error { color: #b42318; min-height: 1.4em; }
      .board { display: flex; align-items: flex-start; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; max-width: 52rem; }
      [data-lp-list], [data-lp-clone]:has(> .list-head) { position: relative; background: #e4e7eb; border-radius: 8px; padding: 0.6rem; width: 13rem; flex: none; }
      .list-head h2 { font-size: 1rem; margin: 0 0 0.25rem; }
      .list-head small { display: block; color: #616e7c; margin-bottom: 0.5rem; }
      [data-lp-cards] { display: flex; flex-direction: column; gap: 0.4rem; min-height: 2rem; max-height: 22rem; overflow-y: auto; }
      .card { position: relative; background: #fff; border: 1px solid #cbd2d9; border-radius: 6px; padding: 0.45rem 0.6rem; }
      [data-lp-list][data-lp-grabbed] { outline: 2px solid #3e7bfa; }
      .card[data-lp-grabbed] { border-color: #3e7bfa; box-shadow: 0 4px 12px rgb(0 0 0 / 0.15); }
      .card strong { display: block; }
      .card small { display: block; color: #616e7c; font-size: 0.8rem; }
      .list-tools { position: absolute; top: 0.3rem; right: 0.35rem; display: flex; gap: 0.1rem; }
      .list-tools .action { border: 0; background: none; color: #7b8794; cursor: pointer; padding: 0 0.25rem; }
      .list-tools .action:hover:enabled { color: #1f2933; }
      .list-tools .action:disabled { opacity: 0.3; cursor: default; }
      .tools { display: flex; gap: 0.15rem; margin-top: 0.3rem; }
      .tools .action { border: 1px solid #e4e7eb; background: #f5f7fa; border-radius: 4px; padding: 0 0.35rem; font-size: 0.8rem; cursor: pointer; color: #52606d; }
      .tools .action:hover:enabled { background: #e4e7eb; }
      .tools .action:disabled { opacity: 0.35; cursor: default; }
      .status { color: #2f6f4f; min-height: 1.4em; margin: 0.25rem 0 0; }
      .log-title { font-size: 1rem; margin: 1rem 0 0.25rem; }
      .log-title small { color: #616e7c; font-weight: normal; }
      .log { font: 0.8rem/1.5 ui-monospace, monospace; color: #3e4c59; max-height: 12rem; overflow-y: auto; margin: 0; }
      [data-lp-list-handle] { cursor: grab; user-select: none; touch-action: none; }
      [data-lp-card] { cursor: grab; user-select: none; touch-action: none; }
      [data-lp-placeholder] { border: 2px dashed #9aa5b1; border-radius: 6px; background: #f5f7fa; }
      [data-lp-clone] { cursor: grabbing; box-shadow: 0 8px 20px rgba(31, 41, 51, 0.25); transform-origin: center; rotate: 2deg; }
    </style>
  </head>
  <body>
    <h1>Board <small id="snapshot"></small></h1>
    <form id="add-list">
      <strong>Add list</strong>
      <input name="id" placeholder="list id" autocomplete="off" required />
      <label>before <select name="before"></select></label>
      <button type="submit">Add</button>
    </form>
    <form id="add-card">
      <strong>Add card</strong>
      <input name="id" placeholder="card id" autocomplete="off" required />
      <label>to <select name="list"></select></label>
      <label>before <select name="before"></select></label>
      <button type="submit">Add</button>
    </form>
    <form id="move-card">
      <strong>Move card</strong>
      <select name="card"></select>
      <label>to <select name="list"></select></label>
      <label>before <select name="before"></select></label>
      <button type="submit">Move</button>
    </form>
    <p class="status" id="status"></p>
    <p class="error" id="error"></p>
    <div class="board" id="board"></div>
    <h2 class="log-title">Events <small id="changes"></small></h2>
    <ol class="log" id="log" reversed></ol>
    <script type="module" src="./main.ts"></script>
    <dialog id="opened">
      <form method="dialog">
        <p></p>
        <label>Name <input name="name" autocomplete="off" /></label>
        <button type="submit" value="save">Save</button>
        <button type="submit" value="close">Close</button>
      </form>
    </dialog>
  </body>
</html>

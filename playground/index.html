<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The saved theme, before the page paints (site/theme.ts runs the button). -->
    <script>
      try {
        const theme = localStorage.getItem("list-picker-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>list-picker kanban demo</title>
  </head>
  <body>
    <nav>
      <a href="../">list-picker</a>
      <a href="../core.html">core</a>
      <a href="../vanilla.html">vanilla</a>
      <a href="./">kanban</a>
      <a href="../player.html">player</a>
      <button type="button" class="nav-theme" data-mode="auto" aria-label="Theme: automatic (switch to light)">
        <svg class="icon-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 4v16a8 8 0 0 0 0-16z" fill="currentColor" /></svg>
        <svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        <svg class="icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
      </button>
      <a class="nav-github" href="https://github.com/fabiomrosa/list-picker" title="GitHub">
        <!-- Octicons mark-github, (c) GitHub Inc., MIT; used to link to GitHub (GitHub logo policy). -->
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" /></svg>
        <span class="sr-only">GitHub</span>
      </a>
    </nav>
    <main class="demo">
    <header class="demo-head">
      <h1>Board <small id="snapshot"></small></h1>
    </header>
    <div class="skins" role="radiogroup" aria-labelledby="skins-label">
      <span id="skins-label">Same board, your look:</span>
      <input type="radio" name="skin" id="skin-cards" value="cards" checked />
      <label for="skin-cards">Cards</label>
      <input type="radio" name="skin" id="skin-terminal" value="terminal" />
      <label for="skin-terminal">Terminal</label>
      <input type="radio" name="skin" id="skin-pop" value="pop" />
      <label for="skin-pop">Pop</label>
    </div>
    <div class="board" id="board" data-skin="cards"></div>
    <section class="panel" aria-labelledby="edit-title">
      <h2 id="edit-title">Edit the board</h2>
      <form id="add-list">
        <strong>Add list</strong>
        <div class="fields">
          <input name="id" placeholder="list id" autocomplete="off" required />
          <label>before <select name="before"></select></label>
          <button type="submit">Add</button>
        </div>
      </form>
      <form id="add-card">
        <strong>Add card</strong>
        <div class="fields">
          <input name="id" placeholder="card id" autocomplete="off" required />
          <label>to <select name="list"></select></label>
          <label>before <select name="before"></select></label>
          <button type="submit">Add</button>
        </div>
      </form>
      <form id="move-card">
        <strong>Move card</strong>
        <div class="fields">
          <select name="card" aria-label="card"></select>
          <label>to <select name="list"></select></label>
          <label>before <select name="before"></select></label>
          <button type="submit">Move</button>
        </div>
      </form>
      <p class="status" id="status" role="status"></p>
      <p class="error" id="error" role="alert"></p>
    </section>
    <section class="panel" aria-labelledby="events-title">
      <h2 class="log-title"><span id="events-title">Events</span> <small id="changes"></small></h2>
      <ol class="log" id="log" reversed></ol>
    </section>
    </main>
    <script type="module" src="./main.ts"></script>
    <dialog id="opened">
      <form method="dialog">
        <p></p>
        <label>Name <input name="name" autocomplete="off" /></label>
        <button type="submit" value="save">Save</button>
        <button type="submit" value="close">Close</button>
      </form>
    </dialog>
  </body>
</html>

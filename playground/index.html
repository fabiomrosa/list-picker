<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>list-picker demo</title>
  </head>
  <body>
    <nav>
      <a href="../">list-picker</a>
      <a href="../core.html">core</a>
      <a href="../vanilla.html">vanilla</a>
      <a href="./">demo</a>
      <a href="https://github.com/fabiomrosa/list-picker">GitHub</a>
    </nav>
    <main class="demo">
    <header class="demo-head">
      <h1>Board <small id="snapshot"></small></h1>
      <div class="skins" role="radiogroup" aria-labelledby="skins-label">
        <span id="skins-label">Same board, your look:</span>
        <input type="radio" name="skin" id="skin-cards" value="cards" checked />
        <label for="skin-cards">Cards</label>
        <input type="radio" name="skin" id="skin-terminal" value="terminal" />
        <label for="skin-terminal">Terminal</label>
        <input type="radio" name="skin" id="skin-pop" value="pop" />
        <label for="skin-pop">Pop</label>
      </div>
    </header>
    <form id="add-list">
      <strong>Add list</strong>
      <input name="id" placeholder="list id" autocomplete="off" required />
      <label>before <select name="before"></select></label>
      <button type="submit">Add</button>
    </form>
    <form id="add-card">
      <strong>Add card</strong>
      <input name="id" placeholder="card id" autocomplete="off" required />
      <label>to <select name="list"></select></label>
      <label>before <select name="before"></select></label>
      <button type="submit">Add</button>
    </form>
    <form id="move-card">
      <strong>Move card</strong>
      <select name="card"></select>
      <label>to <select name="list"></select></label>
      <label>before <select name="before"></select></label>
      <button type="submit">Move</button>
    </form>
    <p class="status" id="status"></p>
    <p class="error" id="error"></p>
    <div class="board" id="board" data-skin="cards"></div>
    <h2 class="log-title">Events <small id="changes"></small></h2>
    <ol class="log" id="log" reversed></ol>
    </main>
    <script type="module" src="./main.ts"></script>
    <dialog id="opened">
      <form method="dialog">
        <p></p>
        <label>Name <input name="name" autocomplete="off" /></label>
        <button type="submit" value="save">Save</button>
        <button type="submit" value="close">Close</button>
      </form>
    </dialog>
  </body>
</html>

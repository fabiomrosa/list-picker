<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The saved theme, before the page paints (site/theme.ts runs the button). -->
    <script>
        try {
          const theme = localStorage.getItem("list-picker-theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch {}
    </script>
    <title>@list-picker/react</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- nav ./ react.html -->
    <main class="doc">
      <!-- markdown: packages/react/README.md -->
    </main>
    <script type="module" src="./theme.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The saved theme, before the page paints (site/theme.ts runs the button). -->
    <script>
        try {
          const theme = localStorage.getItem("list-picker-theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch {}
    </script>
    <title>list-picker board, React</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body>
    <!-- nav ./ in:board.html -->
    <main class="home">
      <!-- demos ./ Board React -->
      <header>
        <h1>Board</h1>
        <p class="lede">
          The kanban board again, written in React with <code>@list-picker/react</code>: the
          Board as state (<code>useBoard</code>), the engine on your own elements
          (<code>useListPicker</code>), and the same skins: the look is still yours.
        </p>
      </header>
      <section class="showcase" aria-label="A live board">
        <div id="react-board"></div>
      </section>
    </main>
    <script type="module" src="./theme.ts"></script>
    <script type="module" src="./react-demo.tsx"></script>
  </body>
</html>
